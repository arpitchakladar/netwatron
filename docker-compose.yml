      context: .
      dockerfile: tests/podman/Containerfile.benign
    container_name: nids-benign
    hostname: benign
    depends_on:
      - target
    environment:
      - TARGET_IP=172.28.0.10
      - ATTACKER_IP=172.28.0.100
      - DURATION=${DURATION:-30}
      - INTENSITY=${INTENSITY:-50}
    networks:
      nids-test-net:
        ipv4_address: 172.28.0.100
    volumes:
      - ./logs:/app/logs

networks:
  nids-test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
